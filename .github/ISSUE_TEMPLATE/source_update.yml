name: Source update
description: Report a stale or changed official source.
title: "[Source]: "
labels: ["source", "compliance"]
body:
  - type: input
    id: source_id
    attributes:
      label: Source ID
      description: The source_id from sources/source-registry.json or config.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Observed change
      description: What appears stale, missing, or changed?
    validations:
      required: true

