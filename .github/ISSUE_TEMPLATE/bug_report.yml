name: Bug report
description: Report a repository, script, documentation, or workflow bug.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scripts
        - config
        - sources
        - skills
        - templates
        - examples
        - docs
        - github metadata
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, redacted input, and observed output when relevant.
      render: shell
    validations:
      required: false
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Could this mislead a founder, contributor, or reviewer?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed personal data, tax numbers, addresses, invoices, identity documents, and authority correspondence.
          required: true

