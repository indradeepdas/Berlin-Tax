name: Documentation issue
description: Report unclear, stale, overconfident, or missing documentation.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location
      description: File path, section, or link.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem
      description: What is unclear, unsafe, stale, or hard to maintain?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Propose wording or structure if you have it.
    validations:
      required: false

